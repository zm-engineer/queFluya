# Run the production image locally with values from .env.local.
# This is NOT a dev environment — for hot reload use `npm run dev`.
#
# Usage:
#   docker compose build       # rebuild image (pass NEXT_PUBLIC_* via env)
#   docker compose up          # start the app on http://localhost:3000
#   docker compose down        # stop

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: quefluya:local
    container_name: quefluya-web
    ports:
      - "3000:3000"
    environment:
      # Runtime-only env vars (Prisma needs DATABASE_URL).
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      # Mirror the build-time public vars so server components can read them
      # too at runtime.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped
